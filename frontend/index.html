<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Sentinel Intelligence | E-Commerce Risk Decision Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = "http://127.0.0.1:8000/predict";
    const HEALTH_URL = "http://127.0.0.1:8000/";

    // Benchmark KPI Cards from EDA & Evaluation on 299,695 transactions
    const KPIS = [
      { label: "Population Fraud Rate", value: "2.21", unit: "%", sub: "from 299,695 transactions" },
      { label: "ROC-AUC Score", value: "0.974", unit: "", sub: "model discrimination power" },
      { label: "PR-AUC Score", value: "0.857", unit: "", sub: "imbalance precision-recall" },
      { label: "Fraud Recall", value: "86.0", unit: "%", sub: "fraud cases intercepted" },
      { label: "Calibrated Precision", value: "95.0", unit: "%", sub: "alert fidelity at t=0.30" },
    ];

    // Empirical Risk Multipliers discovered in EDA
    const SIGNALS = [
      {
        name: "AVS Mismatch",
        mult: "12.7×",
        normalVal: "0.76%",
        dangerVal: "9.67%",
        normalWidth: 8,
        dangerWidth: 97,
        desc: "Address Verification failure shows the single highest empirical risk multiplier."
      },
      {
        name: "Country Mismatch",
        mult: "7.9×",
        normalVal: "1.43%",
        dangerVal: "11.28%",
        normalWidth: 14,
        dangerWidth: 100,
        desc: "Disparity between merchant transaction country and issuing card BIN country."
      },
      {
        name: "3D Secure Not Verified",
        mult: "7.0×",
        normalVal: "0.96%",
        dangerVal: "6.75%",
        normalWidth: 10,
        dangerWidth: 68,
        desc: "Absence of step-up cryptographic 3DS challenge dramatically inflates exposure."
      },
      {
        name: "CVV Mismatch",
        mult: "4.8×",
        normalVal: "0.97%",
        dangerVal: "10.61%",
        normalWidth: 10,
        dangerWidth: 100,
        desc: "Security code failure strongly suggests compromised or spoofed credentials."
      }
    ];

    // Presets for one-click testing
    const PRESETS = {
      safe: {
        title: "Verified Shopper",
        icon: "🛡️",
        type: "safe",
        data: {
          account_age_days: 900,
          total_transactions_user: 85,
          avg_amount_user: 120.0,
          amount: 115.0,
          channel: "app",
          merchant_category: "grocery",
          transaction_time: "2024-02-10T14:30",
          shipping_distance_km: 12.0,
          avs_match: 1,
          cvv_result: 1,
          three_ds_flag: 1,
          promo_used: 0,
          country: "FR",
          bin_country: "FR",
        }
      },
      medium: {
        title: "High-Value Rush",
        icon: "⚠️",
        type: "warn",
        data: {
          account_age_days: 120,
          total_transactions_user: 8,
          avg_amount_user: 85.0,
          amount: 490.0,
          channel: "web",
          merchant_category: "electronics",
          transaction_time: "2024-02-10T23:15",
          shipping_distance_km: 180.0,
          avs_match: 1,
          cvv_result: 1,
          three_ds_flag: 0,
          promo_used: 1,
          country: "FR",
          bin_country: "FR",
        }
      },
      danger: {
        title: "Account Takeover",
        icon: "🚨",
        type: "danger",
        data: {
          account_age_days: 15,
          total_transactions_user: 2,
          avg_amount_user: 45.0,
          amount: 1450.0,
          channel: "web",
          merchant_category: "travel",
          transaction_time: "2024-02-10T03:45",
          shipping_distance_km: 850.0,
          avs_match: 0,
          cvv_result: 0,
          three_ds_flag: 0,
          promo_used: 0,
          country: "FR",
          bin_country: "US",
        }
      }
    };

    function Topbar({ isOnline }) {
      return (
        <header className="topbar">
          <div className="brand">
            <div className="brand-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                <path d="m9 12 2 2 4-4" />
              </svg>
            </div>
            <div className="brand-title">
              <h1>
                Fraud Sentinel Intelligence
                <span className="badge-tag">XGBoost v1.4</span>
              </h1>
              <p>Real-time E-Commerce Risk Decisioning &amp; Anomaly Engine</p>
            </div>
          </div>

          <div className="topbar-actions">
            <div className="spec-chip">
              Calibrated Threshold: <span>t = 0.30</span>
            </div>
            <div className={`status-pill ${isOnline ? "online" : "offline"}`}>
              <span className="dot"></span>
              {isOnline ? "FastAPI Live (8000)" : "Backend Disconnected"}
            </div>
          </div>
        </header>
      );
    }

    function KpiRow() {
      return (
        <section className="kpi-row">
          {KPIS.map((k) => (
            <div className="kpi-card" key={k.label}>
              <div className="kpi-label-wrap">
                <span className="kpi-label">{k.label}</span>
              </div>
              <span className="kpi-value">
                {k.value}
                {k.unit && <small>{k.unit}</small>}
              </span>
              <span className="kpi-sub">{k.sub}</span>
            </div>
          ))}
        </section>
      );
    }

    function SignalsPanel() {
      return (
        <section className="panel signals-panel">
          <div className="panel-header">
            <div className="panel-header-text">
              <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 3v18h18" />
                  <path d="m19 9-5 5-4-4-3 3" />
                </svg>
                Empirical Risk Multipliers
              </h2>
              <p>Fraud rate divergence based on verification checks (EDA hypothesis testing p &lt; 0.001)</p>
            </div>
          </div>

          <div className="signals-container">
            {SIGNALS.map((s) => (
              <div className="signal-item" key={s.name}>
                <div className="signal-top">
                  <span className="signal-name">
                    <span>{s.name}</span>
                  </span>
                  <span className="signal-badge">+{s.mult} Risk</span>
                </div>

                <div className="comparison-bars">
                  <div className="bar-row">
                    <span className="bar-row-label">Verified</span>
                    <div className="bar-track">
                      <div className="bar-fill normal" style={{ width: s.normalWidth + "%" }}></div>
                    </div>
                    <span className="bar-value normal">{s.normalVal}</span>
                  </div>

                  <div className="bar-row">
                    <span className="bar-row-label">Failed / Mismatch</span>
                    <div className="bar-track">
                      <div className="bar-fill danger" style={{ width: s.dangerWidth + "%" }}></div>
                    </div>
                    <span className="bar-value danger">{s.dangerVal}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="panel-note">
            <strong>Temporal Insignificance Insight:</strong> Transaction hour-of-day exhibited uniform background fraud incidence (1.9%–2.5% across 24h), confirming card testing attacks operate invariant to local timezone.
          </div>

          <div className="policy-card">
            <div className="policy-title">Operational Decision Policy</div>
            <div className="policy-grid">
              <div className="policy-step low">
                <div className="policy-badge">APPROVE</div>
                <div className="policy-range">&lt; 0.30</div>
                <div className="policy-desc">Instant Settlement</div>
              </div>
              <div className="policy-step med">
                <div className="policy-badge">CHALLENGE</div>
                <div className="policy-range">0.30 – 0.59</div>
                <div className="policy-desc">Step-up 2FA / Review</div>
              </div>
              <div className="policy-step high">
                <div className="policy-badge">DECLINE</div>
                <div className="policy-range">&ge; 0.60</div>
                <div className="policy-desc">Instant Block</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function CheckerPanel() {
      const [form, setForm] = useState(PRESETS.safe.data);
      const [activePreset, setActivePreset] = useState("safe");
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [latencyMs, setLatencyMs] = useState(null);

      const update = (key) => (e) => {
        setForm({ ...form, [key]: e.target.value });
        setActivePreset(null);
      };

      const loadPreset = (presetKey) => {
        setForm(PRESETS[presetKey].data);
        setActivePreset(presetKey);
      };

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setError(null);

        const payload = {
          account_age_days: parseInt(form.account_age_days) || 0,
          total_transactions_user: parseInt(form.total_transactions_user) || 0,
          avg_amount_user: parseFloat(form.avg_amount_user) || 0,
          amount: parseFloat(form.amount) || 0,
          channel: form.channel,
          merchant_category: form.merchant_category,
          promo_used: parseInt(form.promo_used) || 0,
          avs_match: parseInt(form.avs_match) || 0,
          cvv_result: parseInt(form.cvv_result) || 0,
          three_ds_flag: parseInt(form.three_ds_flag) || 0,
          transaction_time: new Date(form.transaction_time).toISOString(),
          shipping_distance_km: parseFloat(form.shipping_distance_km) || 0,
          country: (form.country || "FR").toUpperCase().trim(),
          bin_country: (form.bin_country || "FR").toUpperCase().trim(),
        };

        const startTime = performance.now();
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail ? JSON.stringify(errData.detail) : `HTTP ${res.status}`);
          }

          const data = await res.json();
          setLatencyMs(Math.round(performance.now() - startTime));
          setResult(data);
        } catch (err) {
          setError(err.message || "Failed to reach inference server");
          setResult(null);
        } finally {
          setLoading(false);
        }
      };

      // Compute explainability factors based on form data
      const getExplainabilityDrivers = () => {
        const drivers = [];
        const isCountryMismatch = form.country.toUpperCase() !== form.bin_country.toUpperCase();
        if (isCountryMismatch) {
          drivers.push({ tag: "danger", label: "GEO", text: `Cross-border card mismatch: Merchant (${form.country.toUpperCase()}) vs BIN (${form.bin_country.toUpperCase()})` });
        }
        if (parseInt(form.avs_match) === 0) {
          drivers.push({ tag: "danger", label: "AVS", text: "Address verification failed (12.7× population multiplier)" });
        }
        if (parseInt(form.three_ds_flag) === 0) {
          drivers.push({ tag: "warn", label: "3DS", text: "3D Secure step-up authentication absent (7.0× risk)" });
        }
        if (parseInt(form.cvv_result) === 0) {
          drivers.push({ tag: "danger", label: "CVV", text: "Card security code failed verification" });
        }
        if (parseFloat(form.amount) > parseFloat(form.avg_amount_user) * 2.5) {
          drivers.push({ tag: "warn", label: "VELOCITY", text: `Order value ($${form.amount}) departs significantly from user average ($${form.avg_amount_user})` });
        }
        if (parseInt(form.account_age_days) < 30) {
          drivers.push({ tag: "warn", label: "ACCOUNT", text: `Newly created user profile (${form.account_age_days} days old)` });
        }
        if (drivers.length === 0) {
          drivers.push({ tag: "clean", label: "VERIFIED", text: "All security checks (AVS, CVV, 3DS) passed with matching domestic issuer" });
        }
        return drivers;
      };

      return (
        <section className="panel checker-panel">
          <div className="panel-header">
            <div className="panel-header-text">
              <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14F195" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                </svg>
                Live Transaction Auditor
              </h2>
              <p>Simulate transactions through the calibrated XGBoost inference engine</p>
            </div>
          </div>

          <div className="presets-container">
            <div className="presets-header">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 14 14" />
              </svg>
              Quick Test Scenarios
            </div>
            <div className="presets-chips">
              {Object.entries(PRESETS).map(([key, p]) => (
                <button
                  type="button"
                  key={key}
                  className={`preset-chip ${activePreset === key ? "active-" + p.type : ""}`}
                  onClick={() => loadPreset(key)}
                >
                  <span>{p.icon}</span>
                  <strong>{p.title}</strong>
                </button>
              ))}
            </div>
          </div>

          <form onSubmit={handleSubmit}>
            {/* GROUP 1: CUSTOMER PROFILE */}
            <div className="field-group">
              <div className="field-group-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                1. Customer Historical Profile
              </div>
              <div className="field-row">
                <label>
                  <span>Account Age (Days) <span className="input-tip">0-3000d</span></span>
                  <input
                    type="number"
                    value={form.account_age_days}
                    onChange={update("account_age_days")}
                    min="0"
                    required
                  />
                </label>
                <label>
                  <span>Prior Transactions <span className="input-tip">user count</span></span>
                  <input
                    type="number"
                    value={form.total_transactions_user}
                    onChange={update("total_transactions_user")}
                    min="0"
                    required
                  />
                </label>
              </div>
              <div className="field-row">
                <label>
                  <span>Historical Avg Amount ($) <span className="input-tip">baseline</span></span>
                  <input
                    type="number"
                    step="0.01"
                    value={form.avg_amount_user}
                    onChange={update("avg_amount_user")}
                    min="0"
                    required
                  />
                </label>
                <label>
                  <span>Current Transaction Amount ($) <span className="input-tip">checkout</span></span>
                  <input
                    type="number"
                    step="0.01"
                    value={form.amount}
                    onChange={update("amount")}
                    min="0.01"
                    required
                  />
                </label>
              </div>
            </div>

            {/* GROUP 2: TRANSACTION CONTEXT */}
            <div className="field-group">
              <div className="field-group-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="2" y="5" width="20" height="14" rx="2" />
                  <line x1="2" y1="10" x2="22" y2="10" />
                </svg>
                2. Transaction Details
              </div>
              <div className="field-row">
                <label>
                  <span>Purchase Channel</span>
                  <select value={form.channel} onChange={update("channel")}>
                    <option value="app">Mobile App</option>
                    <option value="web">Web Browser</option>
                  </select>
                </label>
                <label>
                  <span>Merchant Category</span>
                  <select value={form.merchant_category} onChange={update("merchant_category")}>
                    <option value="grocery">Grocery &amp; Daily</option>
                    <option value="fashion">Fashion &amp; Apparel</option>
                    <option value="electronics">Electronics &amp; Gadgets</option>
                    <option value="travel">Travel &amp; Flights</option>
                    <option value="gaming">Digital Gaming</option>
                  </select>
                </label>
              </div>
              <div className="field-row">
                <label>
                  <span>Transaction Timestamp</span>
                  <input
                    type="datetime-local"
                    value={form.transaction_time}
                    onChange={update("transaction_time")}
                    required
                  />
                </label>
                <label>
                  <span>Shipping Distance (km) <span className="input-tip">merchant-to-dest</span></span>
                  <input
                    type="number"
                    step="0.1"
                    value={form.shipping_distance_km}
                    onChange={update("shipping_distance_km")}
                    min="0"
                    required
                  />
                </label>
              </div>
              <div className="field-row">
                <label>
                  <span>Promotional Code Applied</span>
                  <select value={form.promo_used} onChange={update("promo_used")}>
                    <option value="0">No (Standard Checkout)</option>
                    <option value="1">Yes (Coupon Applied)</option>
                  </select>
                </label>
                <div />
              </div>
            </div>

            {/* GROUP 3: SECURITY & GEOLOCATION */}
            <div className="field-group">
              <div className="field-group-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                3. Security Verifications &amp; Origin
              </div>
              <div className="field-row">
                <label>
                  <span>AVS Match (Address)</span>
                  <select value={form.avs_match} onChange={update("avs_match")}>
                    <option value="1">Match (Verified)</option>
                    <option value="0">No Match (Failed)</option>
                  </select>
                </label>
                <label>
                  <span>CVV Result (Security Code)</span>
                  <select value={form.cvv_result} onChange={update("cvv_result")}>
                    <option value="1">Match (Correct)</option>
                    <option value="0">No Match (Invalid)</option>
                  </select>
                </label>
              </div>
              <div className="field-row">
                <label>
                  <span>3D Secure Challenge</span>
                  <select value={form.three_ds_flag} onChange={update("three_ds_flag")}>
                    <option value="1">Verified (Challenge Passed)</option>
                    <option value="0">Not Verified (Bypassed/None)</option>
                  </select>
                </label>
                <div />
              </div>
              <div className="field-row">
                <label>
                  <span>Merchant Country (ISO) <span className="input-tip">e.g. FR, US, DE</span></span>
                  <input
                    type="text"
                    maxLength="2"
                    value={form.country}
                    onChange={update("country")}
                    required
                  />
                </label>
                <label>
                  <span>Card BIN Country (ISO) <span className="input-tip">e.g. FR, US, GB</span></span>
                  <input
                    type="text"
                    maxLength="2"
                    value={form.bin_country}
                    onChange={update("bin_country")}
                    required
                  />
                </label>
              </div>
            </div>

            <button type="submit" className="btn-submit" disabled={loading}>
              {loading ? (
                <>
                  <span className="spinner"></span>
                  <span>Evaluating Risk Score…</span>
                </>
              ) : (
                <>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                  Run Risk Assessment
                </>
              )}
            </button>
          </form>

          {/* ERROR ALERT */}
          {error && (
            <div className="error-banner">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <div>
                <strong>Inference Failure:</strong> {error}. Ensure FastAPI is active via <code>uvicorn app.main:app --reload</code>.
              </div>
            </div>
          )}

          {/* RESULT CARD */}
          {result && (
            <div className={`result-card risk-${result.risk_level.toLowerCase()}`}>
              <div className="result-header-row">
                <div className="result-verdict">
                  <div className="verdict-icon">
                    {result.risk_level === "Low" && "✓"}
                    {result.risk_level === "Medium" && "!"}
                    {result.risk_level === "High" && "✕"}
                  </div>
                  <div className="verdict-text">
                    <h3>
                      {result.risk_level === "Low" && "APPROVED — LOW RISK"}
                      {result.risk_level === "Medium" && "CHALLENGE — MEDIUM RISK"}
                      {result.risk_level === "High" && "DECLINED — HIGH FRAUD PROBABILITY"}
                    </h3>
                    <p>
                      {result.risk_level === "Low" && "Standard automated settlement cleared"}
                      {result.risk_level === "Medium" && "Trigger step-up authentication or manual queue"}
                      {result.risk_level === "High" && "Automated authorization blocked by risk policy"}
                    </p>
                  </div>
                </div>

                <div className="result-score-block">
                  <div className="score-number">
                    {(result.fraud_probability * 100).toFixed(2)}%
                  </div>
                  <div className="score-caption">Calibrated Probability</div>
                </div>
              </div>

              <div className="meter-wrapper">
                <div className="meter-track">
                  <div
                    className="meter-bar"
                    style={{ width: `${Math.min(result.fraud_probability * 100, 100)}%` }}
                  ></div>
                </div>
                <div className="meter-scale">
                  <span>0.0% Clean</span>
                  <span className="threshold-marker">Threshold: 30%</span>
                  <span>100% Definite Fraud</span>
                </div>
              </div>

              <div className="drivers-box">
                <div className="drivers-title">Decision Factor Breakdown</div>
                <div className="drivers-list">
                  {getExplainabilityDrivers().map((d, i) => (
                    <div className="driver-item" key={i}>
                      <span className={`driver-tag ${d.tag}`}>{d.label}</span>
                      <span className="driver-text">{d.text}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="result-footer-meta">
                <span>Inference: XGBoost + Isotonic Calibrator</span>
                <span>Latency: {latencyMs ? `${latencyMs}ms` : "< 15ms"}</span>
              </div>
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [isOnline, setIsOnline] = useState(false);

      useEffect(() => {
        const checkHealth = async () => {
          try {
            const res = await fetch(HEALTH_URL, { method: "GET" });
            setIsOnline(res.ok);
          } catch {
            setIsOnline(false);
          }
        };

        checkHealth();
        const timer = setInterval(checkHealth, 5000);
        return () => clearInterval(timer);
      }, []);

      return (
        <React.Fragment>
          <Topbar isOnline={isOnline} />
          <main className="dashboard">
            <KpiRow />
            <div className="main-grid">
              <SignalsPanel />
              <CheckerPanel />
            </div>
            <footer className="footer">
              <div className="footer-tech">
                XGBoost Classifier · Isotonic Probability Calibration · FastAPI Backend · React 18
              </div>
              <div className="footer-sub">
                Enterprise E-Commerce Risk Decisioning System · Tuned operational cutoff t = 0.30 for 86% Recall &amp; 95% Calibrated Precision
              </div>
            </footer>
          </main>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
